syntax = "proto3";

package benito.realtime.v1;

message ClientFrame {
  uint32 protocol_version = 1;
  string request_id = 2;

  oneof command {
    AuthenticateCommand authenticate = 10;
    HeartbeatCommand heartbeat = 11;
    CreateMessageCommand create_message = 12;
    UpdateMessageCommand update_message = 13;
    DeleteMessageCommand delete_message = 14;
    ToggleReactionCommand toggle_reaction = 15;
    SeeMessageCommand see_message = 16;
    TogglePinCommand toggle_pin = 17;
    WritingCommand writing = 18;
    CallingCommand calling = 19;
    DeclineCallCommand decline_call = 20;
    VoiceStateCommand voice_state = 21;
  }

  reserved 3 to 9;
}

message ServerFrame {
  uint32 protocol_version = 1;
  string event_id = 2;

  oneof event {
    AuthRefreshRequiredEvent auth_refresh_required = 10;
    ErrorEvent error = 11;
    MessageRejectedEvent message_rejected = 12;
    MessageEvent message_created = 13;
    MessageEvent message_updated = 14;
    MessageEvent message_pin_changed = 15;
    MessageDeletedEvent message_deleted = 16;
    MessageReactionChangedEvent message_reaction_changed = 17;
    MessageSeenEvent message_seen = 18;
    WritingEvent writing = 19;
    PresenceChangedEvent presence_changed = 20;
    VoiceStateChangedEvent voice_state_changed = 21;
    VoiceParticipantMovedEvent voice_participant_moved = 22;
    OwnershipTransferredEvent server_owner_transferred = 25;
    EntityDeletedEvent server_deleted = 26;
    ServerMemberChangedEvent server_member_removed = 27;
    ServerMemberAddedEvent server_member_added = 28;
    ServerMemberRoleChangedEvent server_member_role_changed = 29;
    EntityDeletedEvent room_deleted = 30;
    RoomPermissionsChangedEvent room_permissions_changed = 31;
    VoiceParticipantEvent voice_participant_joined = 32;
    VoiceParticipantEvent voice_participant_left = 33;
    VoiceMoveRequestedEvent voice_move_requested = 34;
    CallingCommand call_invitation = 36;
    DeclineCallCommand call_declined = 37;
    RoomProjection room_updated = 38;
    ServerProjection server_updated = 39;
    NotificationEvent notification = 40;
    ModerationCaseEvent moderation_alert = 41;
    ModerationCaseEvent moderation_case_updated = 42;
    ModerationNoteEvent moderation_note_created = 43;
    ModerationNoteDeletedEvent moderation_note_deleted = 44;
    AutomodRulesChangedEvent moderation_rules_changed = 45;
    AntiRaidIncidentAlertEvent anti_raid_incident_alert = 46;
    MessageTranscriptionChangedEvent message_transcription_changed = 47;
    ChatSummaryChangedEvent chat_summary_changed = 48;
    MediaProjectionChangedEvent media_projection_changed = 50;
    RecordingChangedEvent recording_changed = 51;
    RoomRecordingIndicatorChangedEvent room_recording_indicator_changed = 52;
    UserProfileChangedEvent user_profile_changed = 56;
  }

  reserved 3 to 9;
  reserved 23, 24, 35, 49, 55;
  reserved "external_session_revoked";
  reserved 53, 54;
  reserved "bot_modal_opened", "bot_private_response_changed";
}

message AuthenticateCommand {
  string access_token = 1;
}

message HeartbeatCommand {
  optional double last_location_latitude = 1;
  optional double last_location_longitude = 2;
  optional string status = 3;
}

message CreateMessageCommand {
  bytes client_id = 1;
  bytes user_id = 2;
  bytes room_id = 3;
  optional bytes reply_id = 4;
  optional bytes forwarded_from_message_id = 5;
  optional bytes collection_id = 6;
  string content = 7;
  repeated MediaAttachment media = 8;
  optional MessageMetadata metadata = 9;
  MessageType type = 10;
  reserved 11;
  repeated MentionTarget mentioned_principals = 12;
}

enum RecordingStatus {
  RECORDING_STATUS_UNSPECIFIED = 0;
  RECORDING_STATUS_STARTING = 1;
  RECORDING_STATUS_RECORDING = 2;
  RECORDING_STATUS_STOPPING = 3;
  RECORDING_STATUS_PROCESSING = 4;
  RECORDING_STATUS_READY = 5;
  RECORDING_STATUS_FAILED = 6;
  RECORDING_STATUS_DELETED = 7;
}

// Complete owner-only projection: the client can merge the transition by
// updated_at without issuing a follow-up read.
message RecordingChangedEvent {
  bytes recording_id = 1;
  bytes room_id = 2;
  reserved 3, 5;
  RecordingStatus status = 4;
  optional string title = 6;
  optional bytes media_id = 7;
  optional string media_revision = 8;
  optional string media_read_path = 9;
  optional uint64 duration_ms = 10;
  optional string failure_code = 11;
  int64 requested_at_unix_ms = 12;
  int64 started_at_unix_ms = 13;
  optional int64 stopped_at_unix_ms = 14;
  int64 updated_at_unix_ms = 15;
  optional RecordingTranscription recording_transcription = 16;
  optional RecordingSummary recording_summary = 17;
}

enum RecordingTranscriptionStatus {
  RECORDING_TRANSCRIPTION_STATUS_UNSPECIFIED = 0;
  RECORDING_TRANSCRIPTION_STATUS_PREPARING_INPUT = 1;
  RECORDING_TRANSCRIPTION_STATUS_QUEUED = 2;
  RECORDING_TRANSCRIPTION_STATUS_PROCESSING = 3;
  RECORDING_TRANSCRIPTION_STATUS_READY = 4;
  RECORDING_TRANSCRIPTION_STATUS_FAILED_RETRYABLE = 5;
  RECORDING_TRANSCRIPTION_STATUS_FAILED_TERMINAL = 6;
  RECORDING_TRANSCRIPTION_STATUS_CANCELLED = 7;
}

message RecordingTranscriptionSegment {
  uint64 start_ms = 1;
  uint64 end_ms = 2;
  string text = 3;
  optional float confidence = 4;
}

message RecordingTranscription {
  RecordingTranscriptionStatus status = 1;
  optional string detected_language = 2;
  optional string text = 3;
  repeated RecordingTranscriptionSegment segments = 4;
  optional string error_code = 5;
  bool retryable = 6;
  int64 requested_at_unix_ms = 7;
  int64 updated_at_unix_ms = 8;
}

enum RecordingSummaryStatus {
  RECORDING_SUMMARY_STATUS_UNSPECIFIED = 0;
  RECORDING_SUMMARY_STATUS_QUEUED = 1;
  RECORDING_SUMMARY_STATUS_PROCESSING = 2;
  RECORDING_SUMMARY_STATUS_READY = 3;
  RECORDING_SUMMARY_STATUS_FAILED_RETRYABLE = 4;
  RECORDING_SUMMARY_STATUS_FAILED_TERMINAL = 5;
  RECORDING_SUMMARY_STATUS_CANCELLED = 6;
}

message RecordingSummarySource {
  uint64 start_ms = 1;
  uint64 end_ms = 2;
}

message RecordingSummaryItem {
  string text = 1;
  repeated RecordingSummarySource sources = 2;
}

message RecordingSummary {
  RecordingSummaryStatus status = 1;
  optional string overview = 2;
  repeated RecordingSummaryItem key_decisions = 3;
  repeated RecordingSummaryItem mentions = 4;
  repeated RecordingSummaryItem open_questions = 5;
  repeated RecordingSummaryItem action_items = 6;
  optional string error_code = 7;
  bool retryable = 8;
  int64 requested_at_unix_ms = 9;
  int64 updated_at_unix_ms = 10;
}

// Public-to-the-room state contains no owner or media details.
message RoomRecordingIndicatorChangedEvent {
  bytes room_id = 1;
  bool active = 2;
}

// Signals that an already visible media projection gained a ready derivative.
// The client refreshes only this media item; no room-wide refetch is required.
message MediaProjectionChangedEvent {
  bytes room_id = 1;
  bytes message_id = 2;
  bytes media_id = 3;
  int32 profile = 4;
  int32 profile_version = 5;
  string source_revision = 6;
  optional string owner_type = 8;
  optional bytes owner_id = 9;
  reserved 7;
  reserved "private_response_id";
}

message UpdateMessageCommand {
  bytes message_id = 1;
  bytes room_id = 2;
  string content = 3;
  repeated MediaAttachment media = 4;
  reserved 5;
  repeated MentionTarget mentioned_principals = 6;
}

message DeleteMessageCommand {
  bytes message_id = 1;
  bytes room_id = 2;
}

message ToggleReactionCommand {
  bytes message_id = 1;
  bytes room_id = 2;
  bytes user_id = 3;
  string emoji_name = 4;
}

message SeeMessageCommand {
  bytes message_id = 1;
  bytes room_id = 2;
}

message TogglePinCommand {
  bytes message_id = 1;
  bytes room_id = 2;
}

message WritingCommand {
  bytes room_id = 1;
}

message CallingCommand {
  bytes user_id = 1;
  string user_name = 2;
  repeated MediaAttachment user_media = 3;
  optional string avatar_color = 4;
  bytes room_id = 5;
  optional string room_name = 6;
  repeated bytes receiver_ids = 7;
}

message DeclineCallCommand {
  bytes user_id = 1;
  bytes room_id = 2;
  repeated bytes receiver_ids = 3;
}

message VoiceStateCommand {
  bytes room_id = 1;
  bool audio_muted = 2;
  bool deafened = 3;
}

message MediaAttachment {
  bytes id = 1;
  reserved 2, 3;
  reserved "bucket", "object_key";
  string purpose = 4;
  optional string name = 5;
  optional string mime_type = 6;
  optional uint64 size = 7;
  optional uint64 duration_ms = 8;
  repeated float waveform = 9;
  optional string revision = 10;
  optional MediaResourceProjection original = 11;
  optional MediaResourceProjection display = 12;
}

message MediaResourceProjection {
  string revision = 1;
  string read_url = 2;
  optional string mime_type = 3;
  optional uint64 size = 4;
}

message MessageMetadata {
  reserved 2;
  oneof kind {
    PollMetadata poll = 1;
  }
}

message PollMetadata {
  uint32 version = 1;
  string question = 2;
  repeated string options = 3;
  bool anonymous = 4;
  bool multiple = 5;
  bool allow_change = 6;
}

message AuthRefreshRequiredEvent {
  int64 expires_at_unix_seconds = 1;
}

message ErrorEvent {
  string code = 1;
  string message = 2;
  optional string request_id = 3;
  bool retryable = 4;
}

message MessageRejectedEvent {
  bytes client_id = 1;
  bytes room_id = 2;
  string code = 3;
  string message = 4;
}

enum PrincipalKind {
  PRINCIPAL_KIND_UNSPECIFIED = 0;
  PRINCIPAL_KIND_USER = 1;
  reserved 2;
  reserved "PRINCIPAL_KIND_BOT";
}

message MentionTarget {
  bytes principal_id = 1;
  PrincipalKind kind = 2;
}

message PrincipalProjection {
  bytes id = 1;
  PrincipalKind kind = 2;
  optional string name = 4;
  repeated MediaAttachment media = 5;
  optional string avatar_color = 6;
  reserved 3;
  reserved "application_id";
}

message MessageEvent {
  bytes id = 1;
  bytes client_id = 2;
  PrincipalProjection author = 3;
  bytes room_id = 4;
  int64 room_seq = 5;
  optional bytes server_id = 6;
  optional bytes reply_id = 7;
  optional bytes forwarded_from_message_id = 8;
  optional PrincipalProjection forwarded_from_author = 9;
  reserved 10;
  optional bytes collection_id = 11;
  string content = 12;
  repeated MediaAttachment media = 13;
  repeated Reaction reactions = 14;
  optional MessageMetadata metadata = 15;
  bool edited = 16;
  bool pinned = 17;
  MessageType type = 18;
  reserved 19, 20, 21;
  optional PrincipalProjection reply_author = 22;
  optional string reply_content = 23;
  repeated MediaAttachment reply_media = 24;
  int64 created_at_unix_ms = 25;
  int64 updated_at_unix_ms = 26;
  optional int64 deleted_at_unix_ms = 27;
  repeated MessageTranscription transcriptions = 28;
  optional StickerMessageProjection sticker = 31;
  repeated PrincipalProjection mentioned_principals = 32;
  reserved 29;
  reserved "action_rows";
  reserved 30;
  reserved "component_revision";
}

message StickerMessageProjection {
  bytes sticker_id = 1;
  bytes pack_id = 2;
  string pack_slug = 3;
  string pack_title = 4;
  repeated string emoji = 5;
  string format = 6;
  MediaAttachment media = 7;
  optional MediaAttachment preview = 8;
  uint64 revision = 9;
}

enum MessageTranscriptionStatus {
  MESSAGE_TRANSCRIPTION_STATUS_UNSPECIFIED = 0;
  MESSAGE_TRANSCRIPTION_STATUS_QUEUED = 1;
  MESSAGE_TRANSCRIPTION_STATUS_PROCESSING = 2;
  MESSAGE_TRANSCRIPTION_STATUS_READY = 3;
  MESSAGE_TRANSCRIPTION_STATUS_FAILED_RETRYABLE = 4;
  MESSAGE_TRANSCRIPTION_STATUS_FAILED_TERMINAL = 5;
  MESSAGE_TRANSCRIPTION_STATUS_CANCELLED = 6;
}

message MessageTranscriptionSegment {
  uint64 start_ms = 1;
  uint64 end_ms = 2;
  string text = 3;
  optional float confidence = 4;
}

message MessageTranscription {
  bytes message_id = 1;
  bytes media_id = 2;
  MessageTranscriptionStatus status = 3;
  optional string text = 4;
  optional string detected_language = 5;
  repeated MessageTranscriptionSegment segments = 6;
  optional string error_code = 7;
  bool retryable = 8;
  int64 requested_at_unix_ms = 9;
  int64 updated_at_unix_ms = 10;
}

message MessageTranscriptionChangedEvent {
  bytes room_id = 1;
  MessageTranscription transcription = 2;
}

enum ChatSummaryStatus {
  CHAT_SUMMARY_STATUS_UNSPECIFIED = 0;
  CHAT_SUMMARY_STATUS_QUEUED = 1;
  CHAT_SUMMARY_STATUS_PROCESSING = 2;
  CHAT_SUMMARY_STATUS_READY = 3;
  CHAT_SUMMARY_STATUS_FAILED_RETRYABLE = 4;
  CHAT_SUMMARY_STATUS_FAILED_TERMINAL = 5;
  CHAT_SUMMARY_STATUS_CANCELLED = 6;
}

message ChatSummarySource {
  bytes message_id = 1;
  uint64 room_sequence = 2;
}

message ChatSummaryItem {
  string text = 1;
  repeated ChatSummarySource sources = 2;
}

message ChatSummary {
  bytes snapshot_id = 1;
  bytes room_id = 2;
  uint64 from_sequence = 3;
  uint64 to_sequence = 4;
  ChatSummaryStatus status = 5;
  optional string overview = 6;
  repeated ChatSummaryItem key_decisions = 7;
  repeated ChatSummaryItem mentions = 8;
  repeated ChatSummaryItem open_questions = 9;
  repeated ChatSummaryItem action_items = 10;
  optional string model_revision = 11;
  optional string error_code = 12;
  bool retryable = 13;
  int64 updated_at_unix_ms = 14;
}

message ChatSummaryChangedEvent {
  ChatSummary summary = 1;
}

message Reaction {
  string emoji_name = 1;
  repeated bytes user_ids = 2;
}

message MessageDeletedEvent {
  bytes message_id = 1;
  bytes room_id = 2;
  bytes user_id = 3;
  int64 room_seq = 4;
  MessageType type = 5;
  optional bytes server_id = 6;
}

message MessageReactionChangedEvent {
  bytes message_id = 1;
  bytes room_id = 2;
  repeated Reaction reactions = 3;
}

message MessageSeenEvent {
  bytes room_id = 1;
  bytes message_id = 2;
  bytes user_id = 3;
  uint32 unread_count = 4;
  optional bytes server_id = 5;
  bool server_has_unread = 6;
  int64 last_seen_seq = 7;
}

message WritingEvent {
  bytes room_id = 1;
  bytes user_id = 2;
}

message PresenceChangedEvent {
  bytes user_id = 1;
  string status = 2;
  int64 updated_at_unix_ms = 3;
}

message VoiceStateChangedEvent {
  bytes room_id = 1;
  bytes user_id = 2;
  bool audio_muted = 3;
  bool deafened = 4;
}

message VoiceParticipantMovedEvent {
  bytes user_id = 1;
  bytes source_room_id = 2;
  bytes target_room_id = 3;
}

message OwnershipTransferredEvent {
  bytes entity_id = 1;
  bytes owner_id = 2;
}

message EntityDeletedEvent {
  bytes id = 1;
}

message ServerMemberChangedEvent {
  bytes server_id = 1;
  bytes user_id = 2;
}

message ServerMemberAddedEvent {
  bytes server_id = 1;
  UserProfile user = 2;
  optional ServerProjection server = 3;
}

message ServerMemberRoleChangedEvent {
  bytes server_id = 1;
  bytes user_id = 2;
  RoleSummary role = 3;
  bool assigned = 4;
}

message RoleSummary {
  bytes id = 1;
  string name = 2;
}

message UserProfile {
  bytes id = 1;
  string name = 2;
  string status = 3;
  bool manual_status = 4;
  repeated MediaAttachment media = 5;
  optional string avatar_color = 6;
  optional string cover_color = 7;
  int64 created_at_unix_ms = 8;
  int64 updated_at_unix_ms = 9;
  optional string friendship_status = 10;
  optional string friendship_direction = 11;
  optional int64 friendship_since_unix_ms = 12;
  optional string friend_code = 13;
}

message RoomPermissionsChangedEvent {
  bytes room_id = 1;
  RoomAccessSettings settings = 2;
}

message RoomAccessSettings {
  bool default_can_view = 1;
  bool default_can_send = 2;
  bool default_can_connect = 3;
  repeated RoomPermissionOverride overrides = 4;
}

message RoomPermissionOverride {
  bytes user_id = 1;
  optional bool can_view = 2;
  optional bool can_send = 3;
  optional bool can_connect = 4;
}

message VoiceParticipantEvent {
  bytes room_id = 1;
  VoiceParticipant participant = 2;
}

message VoiceParticipant {
  bytes user_id = 1;
  string name = 2;
  bool audio_muted = 3;
  bool deafened = 4;
  optional string avatar_color = 5;
  repeated MediaAttachment media = 6;
}

message VoiceMoveRequestedEvent {
  bytes source_room_id = 1;
  bytes target_room_id = 2;
}

enum ConversationKind {
  CONVERSATION_KIND_UNSPECIFIED = 0;
  CONVERSATION_KIND_ROOM = 1;
  CONVERSATION_KIND_HUMAN_DIRECT = 2;
  reserved 3;
  reserved "CONVERSATION_KIND_BOT_DIRECT";
}

message RoomProjection {
  bytes id = 1;
  optional bytes server_id = 2;
  bytes owner_id = 3;
  bool direct = 4;
  string name = 5;
  string type = 6;
  optional string last_message_content = 7;
  uint64 unread_count = 8;
  int64 last_seen_seq = 9;
  int64 created_at_unix_ms = 10;
  int64 updated_at_unix_ms = 11;
  repeated bytes allowed_user_ids = 12;
  optional bytes last_message_id = 13;
  optional PrincipalProjection last_message_author = 14;
  optional bytes last_seen_message_id = 15;
  repeated MediaAttachment last_message_media = 16;
  optional int64 last_message_created_at_unix_ms = 17;
  optional int64 deleted_at_unix_ms = 18;
  ConversationKind conversation_kind = 19;
  reserved 20, 21;
  reserved "bot_identity", "bot_installation_id";
}

// Complete public identity projection. Clients merge it by updated_at and do
// not issue a follow-up user/server/media read.
message UserProfileChangedEvent {
  UserProfile user = 1;
}

message ServerProjection {
  bytes id = 1;
  bytes owner_id = 2;
  string name = 3;
  optional string description = 4;
  repeated MediaAttachment avatar = 5;
  string type = 6;
  optional bool pinned = 7;
  optional bool has_unread = 8;
  int64 created_at_unix_ms = 9;
  int64 updated_at_unix_ms = 10;
  repeated ServerAssetProjection quick_reactions = 11;
  repeated ServerAssetProjection soundboard = 12;
  repeated ServerRoleProjection roles = 13;
}

message ServerAssetProjection {
  bytes id = 1;
  string name = 2;
  optional string emoji = 3;
  optional MediaAttachment media = 4;
  optional MediaAttachment icon = 5;
  optional uint64 duration_ms = 6;
}

message ServerRoleProjection {
  bytes id = 1;
  optional bytes server_id = 2;
  string name = 3;
  optional string description = 4;
  repeated ServerPermissionProjection permissions = 5;
  int64 created_at_unix_ms = 6;
  int64 updated_at_unix_ms = 7;
}

message ServerPermissionProjection {
  bytes id = 1;
  string name = 2;
  optional string description = 3;
  int64 created_at_unix_ms = 4;
  int64 updated_at_unix_ms = 5;
}

message NotificationEvent {
  bytes id = 1;
  bytes user_id = 2;
  NotificationType type = 3;
  bool read = 4;
  int64 created_at_unix_ms = 5;
  optional UserProfile actor = 6;
  optional bytes room_id = 7;
  optional bytes message_id = 8;
  optional bytes server_id = 9;
  optional string content = 10;
  optional bytes request_id = 11;
  optional bool approved = 12;
  optional string reason = 13;
}

message ModerationCaseEvent {
  bytes id = 1;
  bytes server_id = 2;
  bytes target_user_id = 3;
  bytes actor_user_id = 4;
  string action = 5;
  string reason = 6;
  string status = 7;
  optional int64 expires_at_unix_ms = 8;
  int64 created_at_unix_ms = 9;
  int64 updated_at_unix_ms = 10;
  optional string target_user_name = 11;
  repeated MediaAttachment target_user_media = 12;
  optional string target_user_avatar_color = 13;
}

message ModerationNoteEvent {
  bytes id = 1;
  bytes server_id = 2;
  bytes target_user_id = 3;
  bytes author_user_id = 4;
  string content = 5;
  int64 created_at_unix_ms = 6;
  int64 updated_at_unix_ms = 7;
  optional string target_user_name = 8;
  repeated MediaAttachment target_user_media = 9;
  optional string target_user_avatar_color = 10;
}

message ModerationNoteDeletedEvent {
  bytes id = 1;
  bytes server_id = 2;
  bytes target_user_id = 3;
}

message AutomodRulesChangedEvent {
  AutomodRuleOperation operation = 1;
  AutomodRule rule = 2;
}

message AutomodRule {
  bytes id = 1;
  bytes server_id = 2;
  string name = 3;
  bool enabled = 4;
  bytes created_by = 5;
  int64 created_at_unix_ms = 6;
  int64 updated_at_unix_ms = 7;

  oneof config {
    SlowmodeConfig slowmode = 10;
    WordFilterConfig word_filter = 11;
    LinkRestrictionConfig link_restriction = 12;
    MediaRestrictionConfig media_restriction = 13;
  }
}

message SlowmodeConfig {
  uint32 seconds = 1;
  bool staff_exempt = 2;
}

message WordFilterConfig {
  repeated string words = 1;
  bool staff_exempt = 2;
}

message LinkRestrictionConfig {
  bool staff_exempt = 1;
}

message MediaRestrictionConfig {
  bool staff_exempt = 1;
}

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_USER = 1;
  MESSAGE_TYPE_SYSTEM = 2;
}

enum NotificationType {
  NOTIFICATION_TYPE_UNSPECIFIED = 0;
  NOTIFICATION_TYPE_FRIEND_REQUEST = 1;
  NOTIFICATION_TYPE_FRIEND_REQUEST_ACCEPTED = 2;
  NOTIFICATION_TYPE_MESSAGE = 3;
  NOTIFICATION_TYPE_MENTION = 4;
  NOTIFICATION_TYPE_SERVER_JOIN_REQUEST = 5;
  NOTIFICATION_TYPE_SERVER_JOIN_REQUEST_APPROVED = 6;
  NOTIFICATION_TYPE_SERVER_JOIN_REQUEST_REJECTED = 7;
}

message AntiRaidIncidentAlertEvent {
  bytes incident_id = 1;
  bytes server_id = 2;
  string detector_mode = 3;
  string effective_mode = 4;
  uint32 score = 5;
  repeated string reason_codes = 6;
  int64 occurred_at_unix_ms = 7;
  bool shadow = 8;
}

enum AutomodRuleOperation {
  AUTOMOD_RULE_OPERATION_UNSPECIFIED = 0;
  AUTOMOD_RULE_OPERATION_UPSERT = 1;
  AUTOMOD_RULE_OPERATION_DELETE = 2;
}
