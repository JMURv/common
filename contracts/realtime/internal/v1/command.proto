syntax = "proto3";

package benito.realtime.internal.v1;

import "realtime/v1/realtime.proto";

message RealtimeCommandEnvelope {
  uint32 protocol_version = 1;
  string command_id = 2;
  bytes actor_id = 3;

  oneof command {
    benito.realtime.v1.CreateMessageCommand create_message = 10;
    benito.realtime.v1.UpdateMessageCommand update_message = 11;
    AuthorizedDeleteMessageCommand delete_message = 12;
    benito.realtime.v1.ToggleReactionCommand toggle_reaction = 13;
    benito.realtime.v1.SeeMessageCommand see_message = 14;
    benito.realtime.v1.TogglePinCommand toggle_pin = 15;
    benito.realtime.v1.WritingCommand writing = 16;
    benito.realtime.v1.CallingCommand calling = 17;
    benito.realtime.v1.DeclineCallCommand decline_call = 18;
    benito.realtime.v1.VoiceStateCommand voice_state = 19;
  }

  reserved 4 to 9;
}

message AuthorizedDeleteMessageCommand {
  benito.realtime.v1.DeleteMessageCommand command = 1;
  bool can_delete_any = 2;
  bool hide_only = 3;
}
