syntax = "proto3";

package benito.realtime.internal.v1;

// Internal NATS transport envelope. The nested server_frame is already encoded
// as benito.realtime.v1.ServerFrame and must be forwarded without re-encoding.
message FanoutEnvelope {
  uint32 protocol_version = 1;
  repeated bytes receiver_ids = 2;
  bytes server_frame = 3;
  FanoutDeliveryClass delivery_class = 4;
  optional string coalesce_key = 5;
}

enum FanoutDeliveryClass {
  FANOUT_DELIVERY_CLASS_UNSPECIFIED = 0;
  FANOUT_DELIVERY_CLASS_DATA = 1;
  FANOUT_DELIVERY_CLASS_CONTROL = 2;
  FANOUT_DELIVERY_CLASS_EPHEMERAL = 3;
}
