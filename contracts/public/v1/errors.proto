syntax = "proto3";

package benito.public.v1;

import "google/protobuf/duration.proto";

// Encoded into tonic::Status::details. The gRPC status code remains authoritative;
// this message supplies a stable application code and structured UI arguments.
message ErrorDetails {
  string code = 1;
  string message_key = 2;
  map<string, string> arguments = 3;
  repeated FieldViolation field_violations = 4;
  google.protobuf.Duration retry_after = 5;
  string request_id = 6;
}

message FieldViolation {
  string field = 1;
  string code = 2;
  map<string, string> arguments = 3;
}
